<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Anmelden – ScobeTube</title>
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="login-page">
    <section class="login-art" aria-hidden="true">
      <div class="rings"></div>
      <div class="brand">
        <span class="mark"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></span>
        <span class="brand-text">SCOBE<i>//</i>TUBE</span>
      </div>
      <h2 class="login-mega"><span class="row" data-split>Press</span><span class="row o" data-split>Play.</span></h2>
      <div class="fine"><span>Self-hosted</span><span>✦</span><span>YouTube</span><span>✦</span><span>SoundCloud</span><span>✦</span><span>1000+ Seiten</span></div>
    </section>

    <section class="login-side">
      <div class="login-card box" id="card">
        <h1 id="heading">Anmelden</h1>
        <p class="lead" id="lead">Willkommen zurück. Wer bist du?</p>
        <form class="form" id="form" autocomplete="on" novalidate>
          <label class="field"><span class="label">Benutzername</span>
            <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32"></label>
          <label class="field"><span class="label">Passwort</span>
            <span class="pw-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
              <button type="button" class="pw-eye" id="eye" aria-label="Passwort anzeigen"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </span>
          </label>
          <div class="caps" id="caps">⇪ Feststelltaste ist aktiv</div>
          <div id="setupExtra" hidden>
            <div class="strength" id="strength"><i></i><i></i><i></i><i></i></div>
            <label class="field mt"><span class="label">Passwort wiederholen</span>
              <input class="input" id="password2" type="password" autocomplete="new-password" maxlength="256"></label>
          </div>
          <label class="toggle remember" id="rememberWrap"><input type="checkbox" id="remember"><span class="box-t"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Angemeldet bleiben (30 Tage)</label>
          <div class="form-msg" id="msg" role="alert"></div>
          <button class="go" type="submit" id="submit"><span class="go-text" id="submitText">Rein da</span><svg viewBox="0 0 24 24"><path d="M5 12h13m0 0-5-5m5 5-5 5"/></svg></button>
        </form>
        <div class="secure-note"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Passwörter werden nur als scrypt-Hash gespeichert.</span></div>
      </div>
    </section>
  </main>
  <script src="static/login.js"></script>
</body>
</html>
