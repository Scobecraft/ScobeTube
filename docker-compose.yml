services:
  scobetube:
    build: .
    # oder fertiges Image, sobald veröffentlicht:
    # image: ghcr.io/scobecraft/scobetube:latest
    container_name: scobetube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./downloads:/downloads   # hier landen die Dateien
      - ./data:/data             # Warteschlange, Cookies, Cache
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - MAX_CONCURRENT_DOWNLOADS=3
      - RETENTION_HOURS=10        # Dateien nach 10 Std. automatisch löschen (0 = nie)
      # Optional: Betreiberangaben auf der Seite „Rechtliches“
      # - OPERATOR_NAME=Dein Name
      # - OPERATOR_CONTACT=deine@mail.de
      # Hinter Cloudflare-Tunnel oder Reverse-Proxy (nginx, Traefik, Caddy …):
      # damit Login-Schutz und HTTPS-Erkennung die echte Besucher-IP sehen.
      # "*" ist ok, solange Port 8081 nicht direkt aus dem Internet erreichbar ist.
      # - TRUSTED_PROXIES=*
      # - YTDLP_CHANNEL=nightly
